[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monobase"
version = "0.2.0"
description = "Shared persistence and config helpers for codcod Python services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "ty>=0.0.80",
]

[tool.hatch.build.targets.wheel]
packages = ["src/monobase"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "E", "B", "I", "PL", "C90"]
ignore = ["PLR2004", "PLC0415"]

fixable = ["ALL"]
unfixable = ["B"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
